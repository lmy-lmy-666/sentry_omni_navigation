/rm_serial_driver:
  ros__parameters:
    # Navigation MCU; verified by 0x50/55-byte telemetry CRC. ACM numbering may change.
    device_name: /dev/serial/by-id/usb-STMicroelectronics_STM32_Virtual_ComPort_3056357F3034-if00
    baud_rate: 115200
    flow_control: none
    parity: none
    stop_bits: "1"
    # New MCU telemetry: reserved=0xE1, yaw=raw large-yaw encoder count.
    # Keep disabled until feedback scale/direction and chassis-forward zero are measured.
    yaw_encoder_calibrated: false
    yaw_encoder_zero_count: 50272.0
    yaw_encoder_rad_per_count: -0.00009541426552382278
